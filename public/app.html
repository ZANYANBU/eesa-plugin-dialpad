<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dialpad · Conversation history</title>
<!--
  Embedded plugin UI (federated), loaded by Eesa's plugins/[slug]/app shell.

  DATA PATH — no credential ever reaches this page.
    1. The shell posts { type:'eesa:session', token, theme } from Eesa's origin.
    2. We capture that origin (event.origin) as the Eesa API base — never guessed.
    3. Every read goes to  POST {eesa}/api/v1/gateway/plugin-ui-invoke/  with the
       short-lived UI-session JWT as a Bearer token. Eesa verifies it, injects the
       tenant's Dialpad key, and proxies to this plugin's own /mcp. The Dialpad key
       exists only on Eesa's server; this page holds a 5-minute scoped token and
       nothing else.
-->
<style>
  :root {
    --bg: #f6f7fb; --surface: #ffffff; --sunk: #eef1f6;
    --ink: #0e1520; --ink-2: #56637a; --ink-3: #8b95a8;
    --line: #e2e7ef; --accent: #5566ff; --accent-soft: #eef0ff;
    --in: #12855b; --out: #7a5cff; --miss: #d0453c;
    --radius: 12px;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  :root[data-theme="dark"] {
    --bg: #0b0e14; --surface: #131824; --sunk: #0e131d;
    --ink: #eef2f8; --ink-2: #9aa6bd; --ink-3: #66718a;
    --line: #222a39; --accent: #7f8cff; --accent-soft: #1b2140;
    --in: #35c98a; --out: #a996ff; --miss: #ff6b60;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  .app { display: grid; grid-template-columns: minmax(0, 380px) 1fr; height: 100dvh; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .detail { display: none; }
    .app[data-view="detail"] .list { display: none; }
    .app[data-view="detail"] .detail { display: flex; }
  }

  /* ── list pane ─────────────────────────────────────────────────────── */
  .list { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
  .list-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .list-head h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .list-head p { margin: 3px 0 0; color: var(--ink-3); font-size: 12.5px; }
  .filters { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .filters label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--ink-3); letter-spacing: .02em; }
  .filters input {
    font: inherit; font-size: 13px; padding: 6px 9px; color: var(--ink);
    background: var(--sunk); border: 1px solid var(--line); border-radius: 8px;
  }
  .filters .apply { align-self: flex-end; padding: 7px 13px; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; font-size: 13px; font-weight: 600; }
  .filters .apply:hover { filter: brightness(1.05); }

  .rows { overflow-y: auto; flex: 1; min-height: 0; }
  .row {
    width: 100%; text-align: left; display: grid; grid-template-columns: 34px 1fr auto;
    gap: 11px; align-items: center; padding: 12px 18px; background: none;
    border: 0; border-bottom: 1px solid var(--line);
  }
  .row:hover { background: var(--sunk); }
  .row[aria-selected="true"] { background: var(--accent-soft); }
  .dir { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .dir svg { width: 15px; height: 15px; }
  .dir.inbound { color: var(--in); background: color-mix(in oklab, var(--in) 14%, transparent); }
  .dir.outbound { color: var(--out); background: color-mix(in oklab, var(--out) 14%, transparent); }
  .dir.missed { color: var(--miss); background: color-mix(in oklab, var(--miss) 14%, transparent); }
  .row .who { min-width: 0; }
  .row .who b { font-weight: 600; font-size: 13.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .who span { color: var(--ink-3); font-size: 12px; font-family: var(--mono); }
  .row .meta { text-align: right; white-space: nowrap; }
  .row .meta b { font-weight: 500; font-size: 12.5px; color: var(--ink-2); display: block; }
  .row .meta span { color: var(--ink-3); font-size: 11.5px; }

  .more { margin: 14px auto; display: block; padding: 8px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-size: 13px; color: var(--ink-2); }
  .more:hover { border-color: var(--accent); color: var(--accent); }
  .more:disabled { opacity: .5; cursor: default; }

  /* ── detail pane ───────────────────────────────────────────────────── */
  .detail { display: flex; flex-direction: column; min-height: 0; }
  .detail-head { padding: 16px 22px; border-bottom: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; gap: 14px; }
  .back { display: none; }
  @media (max-width: 760px) { .back { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 8px; } }
  .detail-head .title { min-width: 0; flex: 1; }
  .detail-head .title b { font-size: 15.5px; font-weight: 650; display: block; }
  .detail-head .title span { color: var(--ink-3); font-size: 12.5px; font-family: var(--mono); }
  .detail-body { overflow-y: auto; padding: 22px; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 20px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .card > h3 { margin: 0; padding: 13px 16px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); border-bottom: 1px solid var(--line); font-weight: 650; }
  .card .body { padding: 16px; }

  .recap { line-height: 1.6; color: var(--ink); white-space: pre-wrap; }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px 20px; }
  .fact b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); }
  .fact span { font-size: 14px; }

  .turn { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 9px 0; }
  .turn + .turn { border-top: 1px solid var(--line); }
  .turn .sp { font-size: 12px; font-weight: 600; white-space: nowrap; padding-top: 1px; }
  .turn .sp.agent { color: var(--out); }
  .turn .sp.customer { color: var(--in); }
  .turn .tx { font-size: 13.5px; }
  .turn .ts { color: var(--ink-3); font-size: 11px; font-family: var(--mono); margin-left: 8px; }
  /* Dialpad emits AI "moments" (call purpose, CSAT flags) in the same stream as
     speech. They are events, not words — show them, but never as dialogue. */
  .turn.sys { padding: 6px 0; }
  .turn.sys .sp { color: var(--ink-3); font-weight: 500; }
  .turn.sys .tx { font-size: 12px; color: var(--ink-3); font-family: var(--mono); }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 999px;
          background: var(--accent-soft); color: var(--ink-2); font-size: 11px; }
  .play { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px;
          border-radius: var(--radius); background: var(--accent); color: #fff;
          font-size: 13px; font-weight: 600; text-decoration: none; }
  .play:hover { filter: brightness(1.06); }
  .muted-note { font-size: 12px; color: var(--ink-3); }

  /* ── states ────────────────────────────────────────────────────────── */
  .state { display: grid; place-items: center; padding: 60px 24px; text-align: center; color: var(--ink-3); gap: 12px; }
  .state svg { width: 34px; height: 34px; opacity: .6; }
  .state .msg { max-width: 34ch; font-size: 13.5px; }
  .spin { width: 26px; height: 26px; border: 2.5px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp .7s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  .skel { height: 62px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, var(--sunk), var(--surface), var(--sunk)); background-size: 200% 100%; animation: sh 1.2s infinite; }
  @keyframes sh { to { background-position: -200% 0; } }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="app" id="app" data-view="list">
    <!-- LIST -->
    <section class="list">
      <div class="list-head">
        <h1>Conversation history</h1>
        <p id="sub">Calls, transcripts and AI recaps</p>
        <div class="filters">
          <label>From<input type="date" id="from" /></label>
          <label>To<input type="date" id="to" /></label>
          <button class="apply" id="apply">Apply</button>
        </div>
      </div>
      <div class="rows" id="rows">
        <div class="skel"></div><div class="skel"></div><div class="skel"></div>
        <div class="skel"></div><div class="skel"></div>
      </div>
    </section>

    <!-- DETAIL -->
    <section class="detail">
      <div class="detail-head">
        <button class="back" id="back" aria-label="Back to list">
          <svg viewBox="0 0 20 20" fill="none" width="16" height="16"><path d="M12 5l-5 5 5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="title"><b id="dTitle">Select a conversation</b><span id="dSub"></span></div>
      </div>
      <div class="detail-body" id="detailBody">
        <div class="state">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 3V5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <div class="msg">Pick a call on the left to read its transcript and AI recap.</div>
        </div>
      </div>
    </section>
  </div>

<script>
(function () {
  'use strict';

  // ── session, handed in by the Eesa shell over postMessage ──────────────
  var TOKEN = null;      // short-lived UI-session JWT (aud=dialpad, surface=ui)
  var EESA = null;       // Eesa API origin — taken from the message origin, not guessed
  var booted = false;

  window.addEventListener('message', function (ev) {
    var m = ev.data || {};
    if (m.type !== 'eesa:session' || !m.token) return;
    // The origin that sent the session IS the Eesa origin we call back into.
    EESA = ev.origin;
    TOKEN = m.token;
    if (m.theme) document.documentElement.setAttribute('data-theme', m.theme);
    if (!booted) { booted = true; loadCalls(true); }
  });
  // Tell the shell we're ready to receive the token.
  try { parent.postMessage({ type: 'eesa:plugin-ready' }, '*'); } catch (e) {}

  /**
   * Invoke a Dialpad READ tool through Eesa's gateway. The gateway verifies the
   * UI token, injects the tenant's Dialpad key, and proxies to this plugin's
   * /mcp. We never hold a credential here.
   */
  async function invoke(tool, args) {
    if (!EESA || !TOKEN) throw new Error('No session.');
    var res = await fetch(EESA + '/api/v1/gateway/plugin-ui-invoke/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
      body: JSON.stringify({ tool: tool, args: args || {} }),
    });
    if (!res.ok) {
      var detail = '';
      try { detail = (await res.json()).detail || ''; } catch (e) {}
      var err = new Error(detail || ('Request failed (' + res.status + ')'));
      err.status = res.status;
      throw err;
    }
    return res.json();
  }

  // ── helpers ────────────────────────────────────────────────────────────
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  }); }
  function fmtTime(ms) {
    if (!ms) return '';
    var d = new Date(Number(ms));
    if (isNaN(d)) return '';
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  function fmtDur(sec) {
    var s = Number(sec); if (!s || isNaN(s)) return '—';
    var m = Math.floor(s / 60), r = Math.round(s % 60);
    return m ? (m + 'm ' + r + 's') : (r + 's');
  }
  function nameOf(call) {
    var c = call.contact || call.external_number_display || {};
    return (c && (c.name || c.display_name)) || call.contact_name ||
           call.external_number || call.to_number || call.from_number || 'Unknown';
  }
  function numberOf(call) {
    return call.external_number || call.to_number || call.from_number || '';
  }
  function directionOf(call) {
    var d = (call.direction || '').toLowerCase();
    if (call.was_missed || call.state === 'missed' || d === 'missed') return 'missed';
    if (d === 'inbound') return 'inbound';
    return 'outbound';
  }
  var DIR_ICON = {
    inbound: '<path d="M15 5L6 14m0 0h6m-6 0V8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
    outbound: '<path d="M5 15l9-9m0 0H8m6 0v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
    missed: '<path d="M6 6l8 8m0-8l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'
  };

  // ── list ────────────────────────────────────────────────────────────────
  var cursor = null, loading = false, calls = [], selectedId = null;

  function toMs(dateStr) {
    if (!dateStr) return undefined;
    var t = Date.parse(dateStr + 'T00:00:00');
    return isNaN(t) ? undefined : t;
  }

  async function loadCalls(reset) {
    if (loading) return;
    loading = true;
    if (reset) { calls = []; cursor = null; selectedId = null; }
    var rows = $('#rows');
    if (reset) rows.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';

    var args = { cursor: cursor || undefined };
    var from = toMs($('#from').value), to = toMs($('#to').value);
    if (from) args.started_after = from;
    if (to) args.started_before = to + 86400000; // inclusive of the "to" day

    try {
      var data = await invoke('call_list', args);
      var items = (data && (data.items || data.calls)) || [];
      cursor = (data && data.cursor) || null;
      calls = calls.concat(items);
      renderList();
    } catch (e) {
      renderListError(e);
    } finally {
      loading = false;
    }
  }

  function renderList() {
    var rows = $('#rows');
    if (!calls.length) {
      rows.innerHTML = '<div class="state">' +
        '<svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 3V5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>' +
        '<div class="msg">No calls in this range yet.</div></div>';
      return;
    }
    var html = calls.map(function (c) {
      var dir = directionOf(c);
      var id = c.call_id || c.id;
      return '<button class="row" data-id="' + esc(id) + '" aria-selected="' + (String(id) === String(selectedId)) + '">' +
        '<span class="dir ' + dir + '"><svg viewBox="0 0 20 20" fill="none">' + DIR_ICON[dir] + '</svg></span>' +
        '<span class="who"><b>' + esc(nameOf(c)) + '</b><span>' + esc(numberOf(c)) + '</span></span>' +
        '<span class="meta"><b>' + esc(fmtTime(c.date_started || c.started_at || c.date_connected)) + '</b>' +
        '<span>' + esc(fmtDur(c.duration || c.total_duration)) + '</span></span>' +
        '</button>';
    }).join('');
    if (cursor) html += '<button class="more" id="more">Load more</button>';
    rows.innerHTML = html;

    Array.prototype.forEach.call(rows.querySelectorAll('.row'), function (b) {
      b.addEventListener('click', function () { openCall(b.getAttribute('data-id')); });
    });
    var more = rows.querySelector('#more');
    if (more) more.addEventListener('click', function () { more.disabled = true; more.textContent = 'Loading…'; loadCalls(false); });
  }

  function renderListError(e) {
    var noCreds = e.status === 409 || /connect|credential|api key/i.test(e.message || '');
    $('#rows').innerHTML = '<div class="state">' +
      '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/><path d="M12 8v5m0 3h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
      '<div class="msg">' + esc(noCreds
        ? 'This workspace hasn’t connected Dialpad yet. Add your Dialpad API key under Purchased Tools → Dialpad, then reopen this page.'
        : (e.message || 'Could not load calls.')) + '</div></div>';
  }

  // ── detail ────────────────────────────────────────────────────────────────
  async function openCall(id) {
    selectedId = id;
    $('#app').setAttribute('data-view', 'detail');
    Array.prototype.forEach.call(document.querySelectorAll('.row'), function (b) {
      b.setAttribute('aria-selected', String(b.getAttribute('data-id') === String(id)));
    });
    var call = calls.filter(function (c) { return String(c.call_id || c.id) === String(id); })[0] || {};
    $('#dTitle').textContent = nameOf(call);
    $('#dSub').textContent = numberOf(call) + ' · ' + fmtTime(call.date_started || call.started_at);
    $('#detailBody').innerHTML = '<div class="state"><div class="spin"></div><div class="msg">Loading transcript…</div></div>';

    // Transcript and recap are independent — a call may have one, both or neither.
    // Transcript, recap and the call detail are independent — a call may have
    // any combination. The detail is what carries admin_recording_urls, which
    // is the only route we have to the audio (see renderDetail).
    // NOTE: call_get_call_info takes `id`, NOT `call_id` — its path is
    // /call/{id}. Passing call_id returns "Missing required path parameter: id".
    var results = await Promise.allSettled([
      invoke('transcripts_get', { call_id: id }),
      invoke('call_get_ai_recap', { id: id }),
      invoke('call_get_call_info', { id: id })
    ]);
    renderDetail(call, results[0], results[1], results[2]);
  }

  function renderDetail(call, transcriptR, recapR, detailR) {
    var parts = [];

    // facts
    // Merge the list row with the fetched detail. Opening a call from a filtered
    // or paged list gave a row without duration/direction, so the Call card
    // rendered five headers above five blanks. The detail is authoritative;
    // fall back to the row, and drop any field we genuinely don't have rather
    // than printing an empty column.
    var det0 = (detailR && detailR.status === 'fulfilled' && detailR.value) ? detailR.value : {};
    var c = Object.assign({}, call || {}, det0 || {});
    var factRows = [
      ['Direction', directionOf(c)],
      ['Duration', fmtDur(c.duration || c.total_duration)],
      ['Started', fmtTime(c.date_started || c.started_at)],
      ['Number', numberOf(c)],
      ['Handled by', (c.target && c.target.name) || '']
    ].filter(function (r) { return r[1] && String(r[1]).trim() && r[1] !== '—'; });
    if (factRows.length) {
      parts.push('<div class="card"><h3>Call</h3><div class="body"><div class="facts">' +
        factRows.map(function (r) { return fact(r[0], r[1]); }).join('') +
        '</div></div></div>');
    }

    // Recording — link out, deliberately.
    // Dialpad's admin_recording_urls are session-protected: fetching one
    // unauthenticated 302s to /login, and a cross-origin <audio> tag sends no
    // Dialpad cookie, so inline playback cannot work. The alternative — minting
    // a share link — creates a PUBLIC url for a recorded customer call, which
    // is not something to do by default. So we hand the user a link that opens
    // in Dialpad, where they are already authorised.
    var det = det0 && Object.keys(det0).length ? det0 : null;
    // Dialpad reports the audio under DIFFERENT keys depending on the call:
    // admin_recording_urls on some, recording_url / recording_details on
    // others (a call can be was_recorded:true with admin_recording_urls null).
    // Read all three and de-duplicate, or genuinely recorded calls show nothing.
    var recUrls = [];
    if (det) {
      [].concat(
        Array.isArray(det.admin_recording_urls) ? det.admin_recording_urls : [],
        Array.isArray(det.recording_url) ? det.recording_url : (det.recording_url ? [det.recording_url] : []),
        Array.isArray(det.recording_details) ? det.recording_details.map(function (r) { return r && r.url; }) : []
      ).forEach(function (u) {
        if (u && recUrls.indexOf(u) === -1) recUrls.push(u);
      });
    }
    if (recUrls.length) {
      parts.push('<div class="card"><h3>Recording</h3><div class="body">' +
        recUrls.map(function (u, i) {
          return '<a class="play" style="margin:0 8px 8px 0" href="' + esc(u) +
            '" target="_blank" rel="noopener noreferrer">' +
            '\u25B6 Play' + (recUrls.length > 1 ? ' (' + (i + 1) + ')' : '') + ' in Dialpad</a>';
        }).join('') +
        '<div class="muted-note">Opens in Dialpad — sign in there if prompted.</div>' +
        '</div></div>');
    } else if ((det && det.was_recorded) || (call && call.was_recorded)) {
      parts.push('<div class="card"><h3>Recording</h3><div class="body">' +
        '<div style="font-size:12px;color:var(--ink-3)">This call was recorded, but no playable link was returned. ' +
        'Open it in Dialpad to listen.</div></div></div>');
    } else if (call && call.was_recorded === false) {
      parts.push('<div class="card"><h3>Recording</h3><div class="body">' +
        '<div style="font-size:12px;color:var(--ink-3)">This call was not recorded.</div>' +
        '</div></div>');
    }

    // AI recap
    if (recapR.status === 'fulfilled' && recapR.value) {
      var recap = recapR.value;   // card only pushed below when it has content
      var summary = recap.summary || (Array.isArray(recap.summaries) ? recap.summaries.join('\n') : '') ||
                    (Array.isArray(recap.purposes) ? recap.purposes.join('\n') : '');
      var actions = Array.isArray(recap.action_items) ? recap.action_items : [];
      if (summary || actions.length) {
        parts.push('<div class="card"><h3>AI recap</h3><div class="body">' +
          (summary ? '<div class="recap">' + esc(summary) + '</div>' : '') +
          (actions.length ? '<div style="margin-top:12px"><b style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)">Action items</b><ul style="margin:6px 0 0;padding-left:18px">' +
            actions.map(function (a) { return '<li>' + esc(typeof a === 'string' ? a : (a.text || a.name || '')) + '</li>'; }).join('') + '</ul></div>' : '') +
          '</div></div>');
      }
    }

    // transcript
    var tCard = '<div class="card"><h3>Transcript</h3><div class="body">';
    if (transcriptR.status === 'fulfilled' && transcriptR.value) {
      var t = transcriptR.value;
      var lines = t.lines || t.transcript || t.entries || [];
      if (Array.isArray(lines) && lines.length) {
        tCard += lines.map(function (ln) {
          var who = (ln.name || ln.speaker || ln.user_type || '').toString();
          var text = ln.content || ln.text || ln.transcript || '';
          var ts = ln.time != null ? fmtClock(ln.time) : '';
          // Dialpad interleaves AI "moments" (call purpose, CSAT flags) with
          // speech. Rendering them as dialogue made the transcript read as if
          // someone had said "ai_csat_reboot_ineligible" out loud. Keep them —
          // they are useful — but mark them as events.
          if (ln.type === 'moment') {
            return '<div class="turn sys"><span class="sp">AI</span>' +
                   '<span class="tx"><span class="chip">' + esc(String(text).replace(/_/g, ' ')) + '</span>' +
                   (ts ? '<span class="ts">' + esc(ts) + '</span>' : '') + '</span></div>';
          }
          var role = /agent|operator|rep|internal/i.test(who) ? 'agent' : 'customer';
          return '<div class="turn"><span class="sp ' + role + '">' + esc(who || (role === 'agent' ? 'Agent' : 'Caller')) + '</span>' +
                 '<span class="tx">' + esc(text) + (ts ? '<span class="ts">' + esc(ts) + '</span>' : '') + '</span></div>';
        }).join('');
      } else {
        tCard += '<div style="color:var(--ink-3);font-size:13px">No transcript is available for this call.</div>';
      }
    } else {
      var msg = (transcriptR.reason && transcriptR.reason.message) || 'No transcript is available for this call.';
      tCard += '<div style="color:var(--ink-3);font-size:13px">' + esc(msg) + '</div>';
    }
    tCard += '</div></div>';
    parts.push(tCard);

    $('#detailBody').innerHTML = parts.join('');
  }

  function fact(label, val) {
    return '<div class="fact"><b>' + esc(label) + '</b><span>' + esc(val) + '</span></div>';
  }
  function fmtClock(sec) {
    var s = Math.floor(Number(sec) || 0);
    var m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  // ── wiring ────────────────────────────────────────────────────────────────
  $('#apply').addEventListener('click', function () { loadCalls(true); });
  $('#back').addEventListener('click', function () { $('#app').setAttribute('data-view', 'list'); });
  ['from', 'to'].forEach(function (id) {
    $('#' + id).addEventListener('keydown', function (e) { if (e.key === 'Enter') loadCalls(true); });
  });

  // If the shell never sends a session (opened standalone / dev), say so.
  setTimeout(function () {
    if (!booted) {
      $('#rows').innerHTML = '<div class="state">' +
        '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/><path d="M12 8v5m0 3h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
        '<div class="msg">Open this from inside Eesa — it needs a signed-in session.</div></div>';
    }
  }, 4000);
})();
</script>
</body>
</html>
